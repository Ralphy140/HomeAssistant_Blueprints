blueprint:
  name: Zigbee2MQTT Button - Shelly Dimmer Light Control
  description: >
    Control a dimmable light using a Zigbee2MQTT button device (single press to
    toggle, hold to dim up/down, double press to set full brightness).
    Designed for use with a Shelly Dimmer or similar dimmable light.

    **Button actions:**
    - **Single press** — Toggle light on/off (or turn on at 100% if already on)
    - **Hold** — Dim up (if brightness below threshold) or dim down (if above threshold)
    - **Release** — Stop dimming
    - **Double press** — Turn on at full brightness (100%)

  domain: automation
  author: Ralphy140
  source_url: https://github.com/Ralphy140/HomeAssistant_Blueprints/blob/main/shelly_dimmer_button_light_control.yaml

  input:
    button_device:
      name: Button Device
      description: The Zigbee2MQTT button device to use as the trigger.
      selector:
        device:
          integration: mqtt

    light_entity:
      name: Light
      description: The dimmable light to control.
      selector:
        entity:
          domain: light

    brightness_threshold:
      name: Brightness Threshold
      description: >
        The brightness level (0–255) used to decide whether holding dims up or
        down. If brightness is below this value, hold will dim up. If above, it
        will dim down.
      default: 128
      selector:
        number:
          min: 1
          max: 254
          step: 1
          mode: slider

    brightness_step_pct:
      name: Brightness Step (%)
      description: How much to change brightness per step while holding.
      default: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: "%"
          mode: slider

    dim_up_delay_ms:
      name: Dim Up Delay (ms)
      description: Delay between brightness steps when dimming up (milliseconds).
      default: 300
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms
          mode: slider

    dim_down_delay_ms:
      name: Dim Down Delay (ms)
      description: Delay between brightness steps when dimming down (milliseconds).
      default: 250
      selector:
        number:
          min: 100
          max: 1000
          step: 50
          unit_of_measurement: ms
          mode: slider

triggers:
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: single
    trigger: device
    id: single
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: hold
    trigger: device
    id: hold
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: release
    trigger: device
    id: release
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: double
    trigger: device
    id: double

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - single
          - condition: state
            entity_id: !input light_entity
            state: "off"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_entity
            data: {}
        alias: Turn on (single press, light off)

      - conditions:
          - condition: trigger
            id:
              - single
          - condition: state
            entity_id: !input light_entity
            state: "on"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_entity
            data: {}
        alias: Turn off (single press, light on)

      - conditions:
          - condition: trigger
            id:
              - hold
          - condition: numeric_state
            entity_id: !input light_entity
            attribute: brightness
            below: !input brightness_threshold
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_step_pct: !input brightness_step_pct
                - delay:
                    milliseconds: !input dim_up_delay_ms
              until:
                - condition: trigger
                  id:
                    - release
        alias: Dim up (hold, brightness below threshold)

      - conditions:
          - condition: trigger
            id:
              - hold
          - condition: numeric_state
            entity_id: !input light_entity
            attribute: brightness
            above: !input brightness_threshold
        sequence:
          - repeat:
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_step_pct: "{{ -1 * brightness_step_pct }}"
                - delay:
                    milliseconds: !input dim_down_delay_ms
              until:
                - condition: trigger
                  id:
                    - release
        alias: Dim down (hold, brightness above threshold)

      - conditions:
          - condition: trigger
            id:
              - double
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_pct: 100
        alias: Full brightness (double press)

mode: restart
