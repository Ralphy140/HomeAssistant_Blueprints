blueprint:
  name: Zigbee2MQTT Button - Dimmable Light Control
  description: >
    Control a dimmable light using a Zigbee2MQTT button device. Single press
    toggles the light on/off, hold dims up or down based on current brightness,
    release stops dimming, and double press jumps to full brightness.

    Works with any dimmable light — Shelly Dimmer, Zigbee bulbs, Hue, and more.

    **Button actions:**
    - **Single press** (light off) — Turn on at last brightness
    - **Single press** (light on) — Turn off
    - **Hold** — Dim up if below threshold, dim down if above threshold
    - **Release** — Stop dimming
    - **Double press** — Turn on at full brightness (100%)

  domain: automation
  author: Ralphy140
  source_url: https://github.com/Ralphy140/HomeAssistant_Blueprints/blob/main/z2m_button_dimmable_light_control.yaml

  input:
    button_device:
      name: Button Device
      description: The Zigbee2MQTT button device to use as the trigger.
      selector:
        device:
          integration: mqtt

    light_entity:
      name: Light
      description: The dimmable light to control.
      selector:
        entity:
          domain: light

    brightness_threshold:
      name: Brightness Threshold
      description: >
        The brightness level (0–255) that determines whether hold dims up or
        down. If the light is below this value when you hold, it will dim up.
        If above, it will dim down. Default of 128 is 50%.
      default: 128
      selector:
        number:
          min: 1
          max: 254
          step: 1
          mode: slider

    min_brightness_pct:
      name: Minimum Brightness (%)
      description: >
        The lowest brightness the light will dim down to before stopping.
        Prevents the light from going so low it effectively turns off.
      default: 5
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"
          mode: slider

    advanced_settings:
      name: Advanced Settings
      icon: mdi:cog
      collapsed: true
      input:
        brightness_step_pct:
          name: Brightness Step (%)
          description: How much to change brightness per step while holding.
          default: 5
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
              mode: slider

        transition:
          name: Transition Time (s)
          description: >
            Transition time in seconds for each brightness step.
            Smoother values between 0.1–0.5 work well for most lights.
          default: 0.3
          selector:
            number:
              min: 0
              max: 2
              step: 0.1
              unit_of_measurement: s
              mode: slider

        dim_up_delay_ms:
          name: Dim Up Delay (ms)
          description: Delay between brightness steps when dimming up (milliseconds).
          default: 300
          selector:
            number:
              min: 100
              max: 1000
              step: 50
              unit_of_measurement: ms
              mode: slider

        dim_down_delay_ms:
          name: Dim Down Delay (ms)
          description: Delay between brightness steps when dimming down (milliseconds).
          default: 250
          selector:
            number:
              min: 100
              max: 1000
              step: 50
              unit_of_measurement: ms
              mode: slider

triggers:
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: single
    trigger: device
    id: single
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: hold
    trigger: device
    id: hold
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: release
    trigger: device
    id: release
  - domain: mqtt
    device_id: !input button_device
    type: action
    subtype: double
    trigger: device
    id: double

conditions: []

variables:
  light_entity: !input light_entity
  brightness_step_pct: !input brightness_step_pct
  min_brightness_pct: !input min_brightness_pct
  transition: !input transition

actions:
  - choose:

      # Single press — turn on if light is off or unavailable
      - conditions:
          - condition: trigger
            id: single
          - condition: not
            conditions:
              - condition: state
                entity_id: !input light_entity
                state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_entity
            data: {}
        alias: Turn on (single press, light off or unavailable)

      # Single press — turn off if light is on
      - conditions:
          - condition: trigger
            id: single
          - condition: state
            entity_id: !input light_entity
            state: "on"
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_entity
            data: {}
        alias: Turn off (single press, light on)

      # Hold — dim up if brightness is at or below threshold
      # mode: restart means the release trigger will interrupt this loop automatically
      - conditions:
          - condition: trigger
            id: hold
          - condition: numeric_state
            entity_id: !input light_entity
            attribute: brightness
            below: !input brightness_threshold
        sequence:
          - repeat:
              while:
                - condition: numeric_state
                  entity_id: !input light_entity
                  attribute: brightness
                  below: 254
                - condition: state
                  entity_id: !input light_entity
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_step_pct: "{{ brightness_step_pct | int }}"
                    transition: "{{ transition | float }}"
                - delay:
                    milliseconds: !input dim_up_delay_ms
        alias: Dim up (hold, brightness at or below threshold)

      # Hold — dim down if brightness is above threshold
      # mode: restart means the release trigger will interrupt this loop automatically
      - conditions:
          - condition: trigger
            id: hold
          - condition: numeric_state
            entity_id: !input light_entity
            attribute: brightness
            above: !input brightness_threshold
        sequence:
          - repeat:
              while:
                - condition: numeric_state
                  entity_id: !input light_entity
                  attribute: brightness
                  above: "{{ (min_brightness_pct | int / 100 * 255) | int }}"
                - condition: state
                  entity_id: !input light_entity
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input light_entity
                  data:
                    brightness_step_pct: "{{ -1 * (brightness_step_pct | int) }}"
                    transition: "{{ transition | float }}"
                - delay:
                    milliseconds: !input dim_down_delay_ms
        alias: Dim down (hold, brightness above threshold)

      # Double press — full brightness
      - conditions:
          - condition: trigger
            id: double
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_entity
            data:
              brightness_pct: 100
              transition: "{{ transition | float }}"
        alias: Full brightness (double press)

mode: restart
